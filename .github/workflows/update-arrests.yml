name: Update Arrests

on:
  workflow_dispatch:
  schedule:
    # Refresh the rolling seven-day arrest blotter every day at 01:00 UTC.
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: whpd-pages-deploy
  cancel-in-progress: false

jobs:
  update-arrests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update arrests from zKillboard
        run: python3 scripts/update_arrests.py

      - name: Build site
        run: python3 build.py

      - name: Prepare Arrests page
        run: |
          mkdir -p publish
          cp docs/Arrests.html publish/Arrests.html

      - name: Deploy Arrests page
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          keep_files: true
