name: Build and Deploy

on:
  workflow_dispatch:
  schedule:
    # Refresh the rolling seven-day arrest blotter every day at 01:00 UTC.
    - cron: '0 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/**'
      - 'data/**'
      - 'docs/css/**'
      - 'docs/js/**'
      - 'build.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update weekly arrests from zKillboard
        run: python3 scripts/update_arrests.py
      
      - name: Build site
        run: python3 build.py
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
