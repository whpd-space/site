name: Build and Deploy Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/**'
      - 'data/**'
      - '!data/memefleets.json'
      - 'docs/css/**'
      - 'docs/images/**'
      - 'docs/js/**'
      - 'build.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

concurrency:
  group: whpd-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Build site
        run: python3 build.py
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
