<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <link rel="canonical" href="{{PAGE_URL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{PAGE_URL}}">
    <meta property="og:image" content="https://whpd.space/images/hovercraft.jpeg">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: grid;
            place-items: center;
            padding: min(24px, 3vh, 4vw);
            background: #102b32;
            color: #fff5c5;
            font-family: Georgia, "Times New Roman", serif;
        }
        main {
            width: min(100%, 800px);
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: min(24px, 3vh);
        }
        .home-link {
            display: block;
            width: min(80px, 12vh);
            margin: 0 auto;
            border-radius: 8px;
        }
        .home-link:focus-visible {
            outline: 3px solid #fff5c5;
            outline-offset: 6px;
        }
        figure {
            margin: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: min(20px, 2.5vh);
            text-align: center;
        }
        img {
            display: block;
            width: auto;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 8px;
        }
        figure img {
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain;
        }
        figcaption {
            font-size: min(clamp(1.25rem, 4vw, 2rem), 5vh);
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <main>
        <a class="home-link" href="https://whpd.space/" aria-label="The Wormhole Police — Home">
            <img src="images/whpd.png" width="80" height="80" alt="The Wormhole Police logo">
        </a>
        <figure>
            <img src="images/hovercraft.jpeg" width="1024" height="1024" alt="Иллюстрация: ховеркрафт, полный угрей, парит над водой.">
            <figcaption>mой ховеркрафт полон угрей!</figcaption>
        </figure>
    </main>
</body>
</html>
